services:
  # 1. Contenedor de la Base de Datos
  db:
    image: mariadb:10.11 # Funciona con esta versión
    container_name: mariadb_service
    restart: always
    volumes:
      - ./mariadb_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5307:3306" # Exponer el puerto solo si necesitas acceder desde tu máquina local

  # 2. Contenedor de Redis
  redis:
    image: redis:alpine
    container_name: redis_service
    restart: always
    ports:
      - "6379:6379"

  # 3. Contenedor de la Aplicación Web (Django)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: django-web-app
    restart: always
    volumes:
      - ./web:/app  # Mapea tu código local para desarrollo en tiempo real
    # Se sacó 'makemigrations' del arranque: generaba migraciones automáticas
    # contra la base productiva. Las migraciones se crean a mano y se commitean.
    command: ["./wait-for-db.sh", "sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py populate_finances && python create_superuser.py && python manage.py create_subscription_expenses --months-ahead=12 && exec gunicorn web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"]

    ports:
      - "5800:8000"
    env_file:
      - ./.env
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123
    networks:
      - default
      - n8n_net
      - nginx_net
    depends_on:
      - db # No intentes iniciar la web hasta que la base de datos esté lista
      - redis # No intentes iniciar la web hasta que Redis esté listo

networks:
  default: {}
  n8n_net:
    external: true
    name: n8n_default
  nginx_net:
    external: true
    name: ngnixproxymanager_default
