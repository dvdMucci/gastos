{% extends 'base.html' %}

{% block title %}Email enviado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body text-center py-4">
                <i class="fas fa-envelope-open-text fa-3x text-primary mb-3"></i>
                <h4>Revisá tu email</h4>
                <p class="text-muted">
                    Si el email está asociado a una cuenta, vas a recibir un enlace para restablecer la contraseña.
                    El enlace vence en una hora.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
